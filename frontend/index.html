<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0B1220">
  <meta name="description" content="SOLARIS – lokales Energie-Monitoring für PV-Anlage, Speicher und Hausverbrauch">
  <title>SOLARIS</title>
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div id="sim-banner" class="sim-banner hidden" role="status">SIMULATION – ANGEZEIGTE WERTE SIND KEINE MESSWERTE</div>
  <div class="app" id="app">
    <aside class="sidebar" id="sidebar" aria-label="Hauptnavigation">
      <a class="brand" href="#/dashboard" aria-label="SOLARIS Startseite">
        <img class="brand-mark" src="assets/icon.svg" alt="">
        <span><span class="brand-name">SOLARIS</span><br><span class="brand-sub">Energy Management · Local Monitoring</span></span>
      </a>
      <nav class="nav" id="nav"></nav>
      <div class="sidebar-foot" id="sidebar-foot">Nur lesender Betrieb</div>
    </aside>
    <div class="main">
      <header class="topbar">
        <button class="menu-btn" id="menu-btn" aria-label="Menü öffnen" aria-controls="sidebar" aria-expanded="false">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
        </button>
        <div>
          <h1 id="page-title">SOLARIS</h1>
          <div class="crumb">Energy Management · Local Monitoring</div>
        </div>
        <div class="topbar-right">
          <span class="pill" id="data-status" data-tip="Datenqualität der Messpunkte"><span class="dot"></span><span>Daten …</span></span>
          <span class="pill" id="conn-status" data-tip="Verbindung zum SOLARIS-Backend"><span class="dot"></span><span>Backend …</span></span>
          <div class="clock" aria-live="off"><div class="time num" id="clock-time">--:--</div><div class="date" id="clock-date"></div></div>
        </div>
      </header>
      <main class="content" id="view" tabindex="-1"><div class="empty">Lade …</div></main>
    </div>
  </div>
  <div class="tip hidden" id="tip" role="tooltip"></div>
  <div class="toast-area" id="toasts" aria-live="polite"></div>
  <noscript><p style="padding:20px">SOLARIS benötigt JavaScript.</p></noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
